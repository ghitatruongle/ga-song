name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.8.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  FLUTTER_VERSION: '3.32.0'
  JAVA_VERSION: '17'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Windows Build
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (MSIX + Portable)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Windows Dependencies
        run: |
          choco install -y wixtoolset --version 3.14.1 2>$null || true
          # Install MSIX packaging tools
          winget install --id Microsoft.MsixPackagingTool -e --accept-source-agreements --accept-package-agreements 2>$null || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate Localizations
        run: flutter gen-l10n

      - name: Build Windows Release
        run: flutter build windows --release --target-platform=windows-x64

      - name: Package MSIX
        if: runner.os == 'Windows'
        run: |
          $msixPath = "build/windows/x64/runner/Release"
          $outputPath = "build/msix"
          New-Item -ItemType Directory -Force -Path $outputPath
          
          # Create MSIX package using MakeAppx
          $makeAppx = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\makeappx.exe"
          if (Test-Path $makeAppx) {
            & $makeAppx pack /d "$msixPath" /p "$outputPath/GA_Song_${{ github.ref_name }}_Windows_MSIX.msix" /l
          } else {
            Write-Warning "MakeAppx not found, skipping MSIX packaging"
          }

      - name: Create Portable ZIP
        run: |
          $releasePath = "build/windows/x64/runner/Release"
          $zipPath = "build/GA_Song_${{ github.ref_name }}_Windows_Portable.zip"
          Compress-Archive -Path "$releasePath\*" -DestinationPath $zipPath -Force

      - name: Generate Checksums
        run: |
          $files = Get-ChildItem "build/" -Recurse -File | Where-Object { $_.Extension -in @('.msix', '.zip') }
          foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 $file.FullName
            "$($hash.Hash)  $($file.Name)" | Out-File -Append "build/SHA256SUMS.txt"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            build/**/*.msix
            build/**/*.zip
            build/SHA256SUMS.txt
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Android Build
  # ─────────────────────────────────────────────────────────────────────────────
  build-android:
    name: Build Android (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate Localizations
        run: flutter gen-l10n

      - name: Build AAB (Release)
        run: flutter build appbundle --release --flavor playstore

      - name: Build APK (Universal)
        run: flutter build apk --release --flavor playstore

      - name: Build APK (Split per ABI)
        run: flutter build apk --release --flavor playstore --split-per-abi

      - name: Generate Checksums
        run: |
          find build/app/outputs -type f \( -name "*.aab" -o -name "*.apk" \) | while read file; do
            sha256sum "$file" >> build/SHA256SUMS.txt
          done

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/bundle/**/*.aab
            build/app/outputs/apk/**/*.apk
            build/SHA256SUMS.txt
          retention-days: 30

      - name: Upload to Play Store (Beta)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: com.ghitatruongle.gasong
          releaseFiles: build/app/outputs/bundle/playstoreRelease/*.aab
          track: beta
          status: draft

  # ─────────────────────────────────────────────────────────────────────────────
  # Linux Build
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux (AppImage + Deb + Tarball)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev libayatana-ido3-0.4-dev librsvg2-dev

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate Localizations
        run: flutter gen-l10n

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Create AppImage
        if: always()
        run: |
          cd build/linux/x64/release/bundle
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          cat > GA_Song.desktop << 'EOF'
          [Desktop Entry]
          Name=GA Song
          Exec=GA_Song
          Icon=GA_Song
          Type=Application
          Categories=AudioVideo;Audio;Player;
          Categories=AudioVideo;Audio;Player;
          StartupNotify=true
          EOF
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r * AppDir/usr/bin/
          cp GA_Song.png AppDir/usr/share/icons/hicolor/256x256/apps/GA_Song.png 2>/dev/null || true
          cp GA_Song.desktop AppDir/usr/share/applications/ 2>/dev/null || true
          ARCH=x86_64 ./appimagetool AppDir GA_Song-${{ github.ref_name }}-Linux_x86_64.AppImage

      - name: Create Deb Package
        run: |
          cd build/linux/x64/release/bundle
          # Create DEBIAN/control
          mkdir -p DEBIAN
          cat > DEBIAN/control << 'EOF'
          Package: ga-song
          Version: ${{ github.ref_name }}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: GA Song Team <ghitatruongle@gmail.com>
          Description: A full-featured music player with KTV mode, lyrics sync, and audio effects.
          Depends: libgtk-3-0, libblkid1, liblzma5
          EOF
          dpkg-deb --build . ../GA_Song_${{ github.ref_name }}_Linux_amd64.deb

      - name: Create Tarball
        run: |
          cd build/linux/x64/release
          tar -czf ../../../GA_Song_${{ github.ref_name }}_Linux_x64.tar.gz bundle

      - name: Generate Checksums
        run: |
          find build/linux -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.tar.gz" \) | while read file; do
            sha256sum "$file" >> build/SHA256SUMS.txt
          done

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            build/linux/**/*.AppImage
            build/linux/**/*.deb
            build/linux/**/*.tar.gz
            build/SHA256SUMS.txt
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Release
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-windows, build-android, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: *-release
          merge-multiple: true

      - name: Organize Artifacts
        run: |
          mkdir -p release_artifacts
          find artifacts -type f \( -name "*.msix" -o -name "*.zip" -o -name "*.aab" -o -name "*.apk" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.tar.gz" \) -exec cp {} release_artifacts/ \;

      - name: Generate SHA256SUMS
        run: |
          cd release_artifacts
          sha256sum * > SHA256SUMS.txt

      - name: Create Release Notes
        id: release_notes
        run: |
          # Extract changelog for this version
          VERSION="${{ github.ref_name }}"
          VERSION_NUM="${VERSION#v}"
          
          # Extract changelog section for this version
          awk -v ver="$VERSION_NUM" '
            /^## \[/ { in_section = 0 }
            $0 ~ "\\[" ver "\\]" { in_section = 1; next }
            in_section { print }
          ' CHANGELOG.md > RELEASE_NOTES.md || echo "No changelog found for $VERSION" > RELEASE_NOTES.md
          
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat RELEASE_NOTES.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: GA Song ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            release_artifacts/*
            release_artifacts/SHA256SUMS.txt
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Post-Release
  # ─────────────────────────────────────────────────────────────────────────────
  post-release:
    name: Post-Release Tasks
    needs: release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Create Stable Release Tag
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          git tag -f stable ${{ github.ref_name }}
          git push origin stable --force

      - name: Update Docker Hub Description (if applicable)
        run: |
          # Update Docker Hub description with latest release notes
          # curl -X PATCH ...

      - name: Notify Discord
        if: ${{ secrets.DISCORD_WEBHOOK != '' }}
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"🎉 GA Song ${{ github.ref_name }} Released!\",
                \"description\": \"New release available for download.\",
                \"url\": \"https://github.com/ghitatruongle/ga-song/releases/tag/${{ github.ref_name }}\",
                \"color\": 16744448,
                \"fields\": [
                  {\"name\": \"Windows\", \"value\": \"MSIX + Portable ZIP\", \"inline\": true},
                  {\"name\": \"Android\", \"value\": \"APK + AAB (Play Store)\", \"inline\": true},
                  {\"name\": \"Linux\", \"value\": \"AppImage + DEB + Tarball\", \"inline\": true}
                ],
                \"footer\": {\"text\": \"GA Song Auto-Release\"}
              }]"