name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Manual trigger

env:
  FLUTTER_VERSION: '3.44.9'
  # Coverage thresholds - will be enforced (not just warning)
  COVERAGE_MIN_LINES: '80'
  COVERAGE_MIN_BRANCHES: '70'
  COVERAGE_MIN_WIDGET: '60'

jobs:
  format:
    name: Verify Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: dart format check
        run: dart format --output=none --set-exit-if-changed lib/ test/

  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: flutter analyze (strict)
        run: flutter analyze --fatal-warnings --fatal-infos
      - name: dart_code_metrics
        run: |
          dart pub global activate dart_code_metrics
          dart pub global run dart_code_metrics:metrics lib/
        continue-on-error: false

  test:
    name: Unit + Widget Tests
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Generate coverage report.
      - name: Run tests with coverage
        run: flutter test --coverage --reporter=expanded
      - name: Generate HTML coverage report
        run: |
          if [ -f coverage/lcov.info ]; then
            sudo apt-get update
            sudo apt-get install -y lcov
            genhtml coverage/lcov.info -o coverage/html --quiet
          fi
      - name: Compute coverage % (enforced thresholds)
        id: coverage
        run: |
          if [ -f coverage/lcov.info ]; then
            # Lines coverage
            LINES_PCT=$(lcov --summary coverage/lcov.info 2>/dev/null | grep -oP 'lines.*:\K[0-9.]+' | head -1)
            echo "lines_pct=$LINES_PCT" >> $GITHUB_OUTPUT
            echo "Lines coverage: $LINES_PCT%"
            
            # Branches coverage (requires lcov 1.14+)
            BRANCHES_PCT=$(lcov --summary coverage/lcov.info 2>/dev/null | grep -oP 'branches.*:\K[0-9.]+' | head -1)
            echo "branches_pct=$BRANCHES_PCT" >> $GITHUB_OUTPUT
            echo "Branches coverage: $BRANCHES_PCT%"
            
            # Fail if below thresholds
            if awk "BEGIN {exit !($LINES_PCT < $COVERAGE_MIN_LINES)}"; then
              echo "::error::Lines coverage $LINES_PCT% is below required $COVERAGE_MIN_LINES%"
              exit 1
            fi
            if awk "BEGIN {exit !($BRANCHES_PCT < $COVERAGE_MIN_BRANCHES)}"; then
              echo "::error::Branches coverage $BRANCHES_PCT% is below required $COVERAGE_MIN_BRANCHES%"
              exit 1
            fi
          else
            echo "::error::No coverage data found"
            exit 1
          fi
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev libayatana-ido3-0.4-dev librsvg2-dev keybinder-3.0-dev libasound2-dev
      - run: flutter pub get
      - name: Run integration tests (Linux desktop)
        run: |
          xvfb-run -a flutter test integration_test/app_test.dart -d linux
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: integration_test/

  golden-test:
    name: Golden Tests (Visual Regression)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev libayatana-ido3-0.4-dev librsvg2-dev keybinder-3.0-dev libasound2-dev
      - run: flutter pub get
      - name: Run golden tests
        run: |
          xvfb-run -a flutter test --update-goldens || true
      - name: Check for golden diffs
        run: |
          if git diff --quiet; then
            echo "No golden file changes"
          else
            echo "::error::Golden test differences detected"
            git diff
            exit 1
          fi
      - name: Upload golden test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-test-diffs
          path: test/goldens/

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev libayatana-ido3-0.4-dev librsvg2-dev keybinder-3.0-dev libasound2-dev
      - run: flutter pub get
      - name: Run startup benchmark
        run: |
          xvfb-run -a flutter test benchmark/startup_benchmark.dart -d linux
        continue-on-error: true
      - name: Run frame time benchmark
        run: |
          xvfb-run -a flutter test benchmark/frame_benchmark.dart -d linux
        continue-on-error: true
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark/results/

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [test, integration-test, golden-test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Ensure AppData directory (cargokit resolve_symlinks)
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\AppData" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\AppData\Local" | Out-Null
      - name: Pre-seed audiotags DLL (CMake cannot extract through plugin symlink)
        run: |
          $ErrorActionPreference = 'Stop'
          $pluginDir = Join-Path (Get-Location) "windows\flutter\ephemeral\.plugin_symlinks\audiotags\windows"
          if (Test-Path "$pluginDir\audiotags.dll") { Write-Host "DLL already present"; exit 0 }
          $tar = Join-Path $pluginDir "windows.tar.gz"
          if (!(Test-Path $tar)) {
            Invoke-WebRequest -Uri "https://github.com/erikas-taroza/audiotags/releases/download/v1.4.5/windows.tar.gz" -OutFile $tar -ErrorAction Stop
          }
          python -c "import tarfile,sys,os; os.chdir(sys.argv[2]); tarfile.open(sys.argv[1],'r:gz').extractall('.')" "$tar" "$pluginDir"
          if (!(Test-Path "$pluginDir\audiotags.dll")) { throw "audiotags.dll was not produced" }
      - name: Build Windows
        run: flutter build windows --release
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/x64/runner/Release/

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [test, integration-test, golden-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          df -h

      - name: Build AAB (Play Store)
        run: flutter build appbundle --release
      - name: Clean intermediates
        run: rm -rf build/app/intermediates
      - name: Build APK (universal)
        run: flutter build apk --release
      - name: Clean intermediates
        run: rm -rf build/app/intermediates
      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      # APK size budget
      - name: Analyze APK sizes
        run: |
          APK_DIR="build/app/outputs/flutter-apk"
          APK_RELEASE_DIR="build/app/outputs/apk/release"
          echo "## Universal APK" >> $GITHUB_STEP_SUMMARY
          UNIVERSAL="${APK_DIR}/app-release.apk"
          if [ -f "$UNIVERSAL" ]; then
            SIZE_BYTES=$(stat --format=%s "$UNIVERSAL")
            SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
            echo "- **app-release.apk**: ${SIZE_MB}MB ($SIZE_BYTES bytes)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Split APKs (per ABI)" >> $GITHUB_STEP_SUMMARY
          for f in "${APK_RELEASE_DIR}"/app-*-release.apk; do
            if [ -f "$f" ]; then
              BASENAME=$(basename "$f")
              SIZE_BYTES=$(stat --format=%s "$f")
              SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
              echo "- **${BASENAME}**: ${SIZE_MB}MB ($SIZE_BYTES bytes)" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Upload APK artifact (universal)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-universal
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Upload split APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-split
          path: |
            build/app/outputs/apk/release/app-armeabi-v7a-release.apk
            build/app/outputs/apk/release/app-arm64-v8a-release.apk
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: [test, integration-test, golden-test]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev lcov keybinder-3.0-dev libasound2-dev libayatana-appindicator3-dev libayatana-ido3-0.4-dev librsvg2-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux/x64/release/bundle/

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [test, integration-test, golden-test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/macos/Build/Products/Release/