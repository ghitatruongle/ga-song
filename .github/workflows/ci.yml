name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.32.0'
  COVERAGE_MIN_PERCENT: '50'  # Phase 5 target; raise over time

jobs:
  format:
    name: Verify Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: dart format check
        run: dart format --output=none --set-exit-if-changed lib/ test/

  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      # Phase 6: treat warnings as errors so regressions fail CI; infos stay
      # warnings to avoid blocking on pre-existing info-level findings.
      - name: flutter analyze
        run: flutter analyze --fatal-warnings

  test:
    name: Unit + Widget Tests
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      # Generate coverage report.
      - name: Run tests with coverage
        run: flutter test --coverage --reporter=expanded
      - name: Generate HTML coverage report
        run: |
          if [ -f coverage/lcov.info ]; then
            sudo apt-get update
            sudo apt-get install -y lcov
            genhtml coverage/lcov.info -o coverage/html --quiet
          fi
      - name: Compute coverage % (lib/core)
        id: coverage
        run: |
          if [ -f coverage/lcov.info ]; then
            PCT=$(lcov --summary coverage/lcov.info 2>/dev/null | grep -oP 'lines.*:\K[0-9.]+' | head -1)
            echo "coverage_pct=$PCT" >> $GITHUB_OUTPUT
            echo "lib/core coverage: $PCT%"
            # Floor at COVERAGE_MIN_PERCENT — does not fail, only annotates.
            if awk "BEGIN {exit !($PCT < $COVERAGE_MIN_PERCENT)}"; then
              echo "::warning::lib/core coverage $PCT% is below target $COVERAGE_MIN_PERCENT%"
            fi
          fi
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/x64/runner/Release/

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get

      - name: Build APK (universal + split per ABI)
        run: flutter build apk --release
      - name: Build AAB (Play Store)
        run: flutter build appbundle --release
      - name: Build AAB (Play Store)
        run: flutter build appbundle --release

      # Phase 6: APK size budget — note that built-in MP3 assets dominate size.
      # App code + native libs target: ≤20MB; built-in songs are excluded from this target.
      - name: Analyze APK sizes
        run: |
          APK_DIR="build/app/outputs/flutter-apk"
          APK_RELEASE_DIR="build/app/outputs/apk/release"
          echo "## Universal APK" >> $GITHUB_STEP_SUMMARY
          UNIVERSAL="${APK_DIR}/app-release.apk"
          if [ -f "$UNIVERSAL" ]; then
            SIZE_BYTES=$(stat --format=%s "$UNIVERSAL")
            SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
            echo "- **app-release.apk**: ${SIZE_MB}MB ($SIZE_BYTES bytes)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Split APKs (per ABI)" >> $GITHUB_STEP_SUMMARY
          for f in "${APK_RELEASE_DIR}"/app-*-release.apk; do
            if [ -f "$f" ]; then
              BASENAME=$(basename "$f")
              SIZE_BYTES=$(stat --format=%s "$f")
              SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
              echo "- **${BASENAME}**: ${SIZE_MB}MB ($SIZE_BYTES bytes)" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Upload APK artifact (universal)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-universal
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Upload split APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-split
          path: |
            build/app/outputs/apk/release/app-armeabi-v7a-release.apk
            build/app/outputs/apk/release/app-arm64-v8a-release.apk
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev lcov
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux/x64/release/bundle/