name: ga_song
description: "A full-featured music player with KTV mode, lyrics sync, and audio effects."
publish_to: 'none'

version: 0.6.5+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  path: ^1.9.0
  flutter_soloud: ^4.0.5
  window_manager: ^0.5.1
  system_tray: ^2.0.3
  shared_preferences: ^2.5.5
  flutter_colorpicker: ^1.1.0
  file_picker: ^11.0.2
  flutter_acrylic: ^1.1.4
  hotkey_manager: ^0.2.3
  smtc_windows: ^1.0.0
  audio_service: ^0.18.18
  path_provider: ^2.1.5
  audio_service_mpris: ^0.2.1
  flutter_riverpod: ^3.0.0
  sqflite: ^2.4.2
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.0
  sqlite3: ^2.4.0
  youtube_player_iframe: ^5.2.2
  http: ^1.2.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  audiotags: ^1.4.5
  palette_generator: ^0.3.3+7
  # Used in main.dart to init sqflite FFI on desktop platforms (not test-only).
  sqflite_common_ffi: ^2.3.4+4
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  msix: ^3.16.13
  debian: ^1.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.8
  json_serializable: ^6.8.0
  drift_dev: ^2.14.0

flutter:
  uses-material-design: true

  assets:
    - assets/song/
    - assets/song/mat_nham_mat_mo/
    - assets/song/anh_trai_say_hi/
    - assets/pic/
    - assets/pic/mat_nham_mat_mo/
    - assets/pic/anh_trai_say_hi/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/pic/app_logo.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/pic/app_logo.png"
    icon_size: 256

msix_config:
  display_name: GA Song
  publisher_display_name: GA Song
  title_bar_color: '#FF000000'
  logo_path: assets/pic/app_logo.png
  capabilities: internetClient, microphone

dependency_overrides:
  hotkey_manager_linux:
    path: packages/hotkey_manager_linux
  uuid: ^4.5.1
  flutter_rust_bridge: 2.11.1
  test: ^1.25.8
  test_api: ^0.7.10
  matcher: ^0.12.19

debian:
  name: ga-song
  display_name: GA Song
  description: A new Flutter project.
  maintainer: ghitatruongle <ghitatruongle@gmail.com>
  version: 0.1.2
  section: utils
  priority: optional
  architecture: amd64
  depends: libgtk-3-0, libblkid1, liblzma5
